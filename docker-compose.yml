services:
  posrat:
    build:
      context: .
      dockerfile: Dockerfile
    image: posrat:latest
    container_name: posrat
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Persistent storage-secret (cookies survive container restarts).
      # Change this for your deployment; keep it stable across upgrades.
      POSRAT_STORAGE_SECRET: "change-me-to-a-long-random-string"

      # Bootstrap the initial admin account on first start.
      # Once an admin exists, these are ignored (see posrat.system.bootstrap).
      POSRAT_ADMIN_USERNAME: "admin"
      POSRAT_ADMIN_PASSWORD: "change-me"
      POSRAT_ADMIN_DISPLAY_NAME: "Administrator"

      # Data dir / no-browser are already set in the image, but kept here
      # as documentation for operators.
      POSRAT_DATA_DIR: "/data"
      POSRAT_NO_BROWSER: "1"

      # ----- AI chat (optional) -------------------------------------------
      # The AI chat assistant (admin → "AI chat" tab) uses the boto3
      # default credential chain, so any of the following work:
      #   * AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (+ SESSION_TOKEN)
      #   * AWS_PROFILE pointing at a mounted ~/.aws/ directory (see
      #     the commented-out volume below)
      #   * IMDS when the container runs on EC2 with an IAM role
      # AWS_DEFAULT_REGION is used only when the admin panel hasn't
      # saved one yet (defaults to eu-west-1 anyway).
      # AWS_ACCESS_KEY_ID: "AKIA..."
      # AWS_SECRET_ACCESS_KEY: "..."
      # AWS_SESSION_TOKEN: "..."   # only for temporary creds / SSO
      # AWS_DEFAULT_REGION: "eu-west-1"
      # AWS_PROFILE: "default"     # alternative: mount ~/.aws/ below
    volumes:
      - posrat-data:/data
      # Alternative to access keys: mount the host's ~/.aws/ so the
      # container reuses your local profile / SSO cache.
      # - ~/.aws:/home/posrat/.aws:ro


volumes:
  posrat-data:
